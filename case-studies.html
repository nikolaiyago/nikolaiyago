<!doctype html>
<html lang="en">
  <head>
    <script>document.documentElement.setAttribute("data-theme",localStorage.getItem("portfolio-theme")||"dark");</script>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <link rel="icon" type="image/png" href="/images/logo.png?v=logo6" />
    <link rel="apple-touch-icon" href="/images/apple-touch-icon.png?v=logo6" />
    <title>Case Studies — Nikolai Yago Conde</title>
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link
      href="https://fonts.googleapis.com/css2?family=Open+Sans:ital,wght@0,300;0,400;0,500;0,600;0,700;0,800;1,300;1,400&display=swap"
      rel="stylesheet"
    />
    <link rel="stylesheet" href="/css/base.css?v=mailfab1" />
    <link rel="stylesheet" href="/css/case-studies.css?v=phonetop8" />

    <!-- Prefetch case study pages -->
    <link rel="prefetch" as="document" href="/know-your-rights.html" />
    <link rel="prefetch" as="document" href="/tap-to-join.html" />
    <link rel="prefetch" as="document" href="/wcag.html" />
    <link rel="prefetch" as="document" href="/our-fjord.html" />
    <link rel="prefetch" as="document" href="/rema.html" />
    <link rel="prefetch" as="image" href="https://www.figma.com/api/mcp/asset/44506d4b-dee8-4a9b-a953-786dd624204d" />
    <link rel="prefetch" as="image" href="https://www.figma.com/api/mcp/asset/69c1fe14-9db7-47bf-920e-7bd329a1533b" />
    <link rel="prefetch" as="image" href="/images/ttj/retro-notes.jpg?v=ttjretro1" />
    <link rel="prefetch" as="image" href="https://www.figma.com/api/mcp/asset/b980da7b-14f8-4cf6-9557-35e71600b9c2" />
  </head>
  <body>
    <!--
      ============================================
      CASE STUDIES PAGE (case-studies.html)
      ============================================
      - Full-viewport snap sections (hero + each project)
      - Side rail on the right (rounded lines)
      - Filters on the hero (All / Interaction Design / …)
      - Shared chrome: logo nav + utils (lang / visitors / theme)
      - Phone (≤900px): top-left tiger + utils row · section rail bottom-right
      - Tab = sections · Enter = filters & project links · Esc = out
      Scripts: translations → i18n → theme → presence → site-nav → site-mail → keyboard → case-studies
    -->

    <nav class="site-nav" aria-label="Primary">
      <div class="site-nav__shell">
                <span class="site-nav__logo" aria-hidden="true">
          <img
            src="/images/logo.svg?v=logo7"
            alt=""
            width="80"
            height="80"
          />
        </span>
        <div class="site-nav__mouth">
          <div class="site-nav__menu">
            <a class="site-nav__link" data-nav="me" href="/index.html" data-i18n="nav.me">Me</a>
            <a class="site-nav__link" data-nav="cases" href="/case-studies.html" aria-label="Case Studies"><span class="site-nav__link-line">Case</span><span class="site-nav__link-line">Studies</span></a>
            <a class="site-nav__link" data-nav="collection" href="/collection.html" data-i18n="nav.collection">Collection</a>
          </div>
        </div>
      </div>
    </nav>
    <!--
      Site utilities
      Desktop: language · live visitors · theme in a row (top-right); mail FAB bottom-right
      Phone: top-left tiger + orange utils row (lang | theme | live | mail)
    -->
    <div class="site-utils" aria-label="Site utilities">
      <button
        type="button"
        class="site-utils__menu-btn"
        data-utils-open
        aria-expanded="false"
        aria-controls="site-utils-panel"
        data-i18n-attr="aria-label:utils.menu"
      >
        <span class="site-utils__menu-icon" aria-hidden="true"></span>
      </button>

      <div class="site-utils__panel" id="site-utils-panel">
        <button
          type="button"
          class="site-utils__close"
          data-utils-close
          data-i18n-attr="aria-label:utils.close"
        >
          <span aria-hidden="true">×</span>
        </button>

        <div class="site-utils__langs" role="group" data-i18n-attr="aria-label:utils.lang">
          <button type="button" class="site-utils__lang" data-lang="NO">NO</button>
          <button type="button" class="site-utils__lang" data-lang="ENG">ENG</button>
          <button type="button" class="site-utils__lang" data-lang="ESP">ESP</button>
        </div>

        <button type="button" class="site-utils__theme" data-theme-toggle aria-label="Theme">
          <span class="site-utils__theme-icon" aria-hidden="true"></span>
          <span data-theme-label data-i18n="utils.dark">Dark</span>
        </button>

        <!-- Mail: phone dock segment; desktop fixed FAB (position:fixed escapes panel) -->
        <button
          type="button"
          class="home-mail"
          id="copy-email"
          data-email="nikolaiconde@gmail.com"
          data-i18n-attr="aria-label:home.email"
        >
          <span class="home-mail__label" aria-live="polite">
            <svg class="home-mail__copy-icon" width="20" height="20" viewBox="0 0 24 24" fill="none" aria-hidden="true">
              <rect x="8" y="8" width="12" height="12" rx="2.5" stroke="currentColor" stroke-width="2" />
              <path
                d="M6 14.5V6.5A2.5 2.5 0 0 1 8.5 4H16"
                stroke="currentColor"
                stroke-width="2"
                stroke-linecap="round"
              />
            </svg>
            <span data-i18n="home.email_copied">Email Copied</span>
          </span>
          <span class="home-mail__icon" aria-hidden="true">
            <svg width="28" height="28" viewBox="0 0 24 24" fill="none">
              <rect x="3" y="5" width="18" height="14" rx="2.5" stroke="currentColor" stroke-width="2" />
              <path
                d="M4 7.5 12 13l8-5.5"
                stroke="currentColor"
                stroke-width="2"
                stroke-linecap="round"
                stroke-linejoin="round"
              />
            </svg>
          </span>
        </button>
      </div>
    </div>


    <!-- Side navigation: one line per section -->
    <nav class="section-rail" id="section-rail" aria-label="Section navigation">
      <div class="section-rail__list" role="list" id="section-rail-list">
        <!-- Filled by case-studies.js -->
      </div>
    </nav>

    <!-- Scroll container for snap sections -->
    <div class="page" id="case-studies-scroller">
      <!-- Hero + filters -->
      <section class="snap-section snap-section--hero" data-section data-snap-section id="hero">
        <div class="hero">
          <!--
            Figma 811:7960 — title + text share one box so edges align
            under the title. Desktop: one line. Phone: CASE / STUDIES stack
            (Me-page name scale — orange Bison display).
          -->
          <div class="hero__head">
            <h1 class="hero__title" data-i18n-attr="aria-label:cases.title">
              <span data-i18n="cases.title_line1">CASE</span>
              <span data-i18n="cases.title_line2">STUDIES</span>
            </h1>
            <div class="hero__copy">
              <div class="hero__lead">
                <p data-i18n="cases.lead1">This is my skim page.</p>
                <p data-i18n="cases.lead2">Find a project that interests you.</p>
                <p data-i18n="cases.lead3">Click to see the introduction and final result.</p>
                <p data-i18n="cases.lead4">Scroll down for the full process.</p>
                <p data-i18n="cases.lead5">Enjoy!</p>
              </div>
              <div class="hero__note">
                <p data-i18n="cases.note1">This portfolio is a work in progress.</p>
                <p data-i18n="cases.note2">I will keep adding previous and new projects continuously.</p>
                <p data-i18n="cases.note3"></p>
                <p data-i18n="cases.note4"></p>
                <p data-i18n="cases.note5"></p>
              </div>
            </div>
          </div>
          <div class="filters" role="tablist" data-i18n-attr="aria-label:cases.categories">
            <button type="button" class="filter filter--active" data-filter="All" data-i18n="cases.filter_all">All</button>
            <button type="button" class="filter" data-filter="Favorites" data-i18n="cases.filter_favorites">Personal favorites</button>
            <button type="button" class="filter" data-filter="Interaction Design" data-i18n="cases.filter_ixd">Interaction Design</button>
            <button type="button" class="filter" data-filter="Systems-Oriented Design" data-i18n="cases.filter_sod">Systems-Oriented Design</button>
            <button type="button" class="filter filter--disabled" data-filter="Graphic Design" disabled data-i18n="cases.filter_gd">Graphic Design</button>
            <button type="button" class="filter filter--disabled" data-filter="Service Design" disabled data-i18n="cases.filter_sd">Service Design</button>
            <button type="button" class="filter filter--disabled" data-filter="Product Design" disabled data-i18n="cases.filter_pd">Product Design</button>
          </div>
        </div>
      </section>

      <!-- Project cards are injected by case-studies.js -->
      <div id="studies-root"></div>
    </div>

    <p class="site-live-count" aria-live="polite" hidden>
      <span data-visitor-count></span>
      <span data-i18n="utils.visiting">visiting</span>
    </p>

    <script src="/js/translations.js?v=phonetitle2"></script>
    <script src="/js/i18n.js?v=phonetop4"></script>
    <script src="/js/theme.js"></script>
    <script src="/js/site-utils.js?v=phonetop4"></script>
    <script src="/js/presence.js?v=livecount2"></script>
    <script src="/js/site-nav.js?v=mouthfix2"></script>
    <script src="/js/site-mail.js?v=phonetop4"></script>
    <script src="/js/keyboard-nav.js?v=stops2"></script>
    <script type="module" src="/js/case-studies.js?v=railscrub1"></script>
    <script src="/js/content-guard.js?v=6"></script>
  </body>
</html>
