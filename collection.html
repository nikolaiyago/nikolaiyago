<!doctype html>
<html lang="en">
  <head>
    <script>document.documentElement.setAttribute("data-theme",localStorage.getItem("portfolio-theme")||"dark");</script>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <link rel="icon" type="image/png" href="/images/logo.png?v=logo6" />
    <link rel="apple-touch-icon" href="/images/apple-touch-icon.png?v=logo6" />
    <title>Collection — Nikolai Yago Conde</title>
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link
      href="https://fonts.googleapis.com/css2?family=Open+Sans:ital,wght@0,300;0,400;0,500;0,600;0,700;0,800;1,300;1,400&display=swap"
      rel="stylesheet"
    />
    <link rel="stylesheet" href="/css/base.css?v=mailfab1" />
    <link rel="stylesheet" href="/css/collection.css?v=collectiontitle2" />
  </head>
  <body>
    <nav class="site-nav" aria-label="Primary">
      <div class="site-nav__shell">
                <span class="site-nav__logo" aria-hidden="true">
          <img
            src="/images/logo.svg?v=logo7"
            alt=""
            width="80"
            height="80"
          />
        </span>
        <div class="site-nav__mouth">
          <div class="site-nav__menu">
            <a class="site-nav__link" data-nav="me" href="/index.html" data-i18n="nav.me">Me</a>
            <a class="site-nav__link" data-nav="cases" href="/case-studies.html" aria-label="Case Studies"><span class="site-nav__link-line">Case</span><span class="site-nav__link-line">Studies</span></a>
            <a class="site-nav__link" data-nav="collection" href="/collection.html" data-i18n="nav.collection">Collection</a>
          </div>
        </div>
      </div>
    </nav>
    <!--
      Site utilities
      Desktop: language · live visitors · theme in a row (top-right); mail FAB bottom-right
      Phone: top-left tiger + orange utils row (lang | theme | live | mail)
    -->
    <div class="site-utils" aria-label="Site utilities">
      <button
        type="button"
        class="site-utils__menu-btn"
        data-utils-open
        aria-expanded="false"
        aria-controls="site-utils-panel"
        data-i18n-attr="aria-label:utils.menu"
      >
        <span class="site-utils__menu-icon" aria-hidden="true"></span>
      </button>

      <div class="site-utils__panel" id="site-utils-panel">
        <button
          type="button"
          class="site-utils__close"
          data-utils-close
          data-i18n-attr="aria-label:utils.close"
        >
          <span aria-hidden="true">×</span>
        </button>

        <div class="site-utils__langs" role="group" data-i18n-attr="aria-label:utils.lang">
          <button type="button" class="site-utils__lang" data-lang="NO">NO</button>
          <button type="button" class="site-utils__lang" data-lang="ENG">ENG</button>
          <button type="button" class="site-utils__lang" data-lang="ESP">ESP</button>
        </div>

        <button type="button" class="site-utils__theme" data-theme-toggle aria-label="Theme">
          <span class="site-utils__theme-icon" aria-hidden="true"></span>
          <span data-theme-label data-i18n="utils.dark">Dark</span>
        </button>

        <!-- Mail: phone dock segment; desktop fixed FAB (position:fixed escapes panel) -->
        <button
          type="button"
          class="home-mail"
          id="copy-email"
          data-email="nikolaiconde@gmail.com"
          data-i18n-attr="aria-label:home.email"
        >
          <span class="home-mail__label" aria-live="polite">
            <svg class="home-mail__copy-icon" width="20" height="20" viewBox="0 0 24 24" fill="none" aria-hidden="true">
              <rect x="8" y="8" width="12" height="12" rx="2.5" stroke="currentColor" stroke-width="2" />
              <path
                d="M6 14.5V6.5A2.5 2.5 0 0 1 8.5 4H16"
                stroke="currentColor"
                stroke-width="2"
                stroke-linecap="round"
              />
            </svg>
            <span data-i18n="home.email_copied">Email Copied</span>
          </span>
          <span class="home-mail__icon" aria-hidden="true">
            <svg width="28" height="28" viewBox="0 0 24 24" fill="none">
              <rect x="3" y="5" width="18" height="14" rx="2.5" stroke="currentColor" stroke-width="2" />
              <path
                d="M4 7.5 12 13l8-5.5"
                stroke="currentColor"
                stroke-width="2"
                stroke-linecap="round"
                stroke-linejoin="round"
              />
            </svg>
          </span>
        </button>
      </div>
    </div>


    <main class="collection" data-section id="collection">
      <!--
        Desktop: line spans sit flush as one word.
        Phone (≤900px): Me / Case Studies name scale — white Bison, stacked.
      -->
      <h1 class="collection__title" data-i18n-attr="aria-label:collection.title">
        <span data-i18n="collection.title_line1">Collec</span>
        <span data-i18n="collection.title_line2">tion</span>
      </h1>
      <p class="collection__lead" data-i18n="collection.lead">
        A growing shelf of experiments, visuals, and side pieces — coming soon.
      </p>
    </main>

    <p class="site-live-count" aria-live="polite" hidden>
      <span data-visitor-count></span>
      <span data-i18n="utils.visiting">visiting</span>
    </p>

    <script src="/js/translations.js?v=collectiontitle2"></script>
    <script src="/js/i18n.js?v=phonetop4"></script>
    <script src="/js/theme.js"></script>
    <script src="/js/site-utils.js?v=phonetop4"></script>
    <script src="/js/presence.js?v=livecount2"></script>
    <script src="/js/site-nav.js?v=mouthfix2"></script>
    <script src="/js/site-mail.js?v=phonetop4"></script>
    <script src="/js/keyboard-nav.js?v=stops2"></script>
    <script src="/js/collection.js?v=colstretch1"></script>
    <script src="/js/content-guard.js?v=6"></script>
  </body>
</html>
